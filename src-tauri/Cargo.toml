[package]
name = "project-widget"
version = "2.0.0"
description = "项目进度桌面挂件（Tauri v2）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["multipart"] }
rfd = "0.15"

[profile.release]
strip = true
opt-level = "s"
