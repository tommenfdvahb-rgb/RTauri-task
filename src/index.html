<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>项目进度挂件</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header data-tauri-drag-region>
    <span class="t" data-tauri-drag-region>📋 今日待办</span><span class="cnt" id="cnt" hidden></span>
    <span class="sp" data-tauri-drag-region></span>
    <button id="btn-pin" title="切换总是置顶" onclick="togglePin()">📌</button>
    <button title="设置" onclick="openSetup()">⚙</button>
    <button title="打开管理页面" onclick="openApp()">🌐</button>
    <button title="立即刷新" onclick="load()">↻</button>
    <button title="退出挂件" onclick="quitApp()">✕</button>
  </header>

  <div id="list"><div class="empty">正在连接服务器…</div></div>

  <footer id="foot" data-tauri-drag-region>
    <span class="drag-hint" data-tauri-drag-region>⠿ 按住此处拖动 · 拖动窗口边缘调整大小</span>
    <span id="foot-time"></span>
  </footer>

  <div id="setup">
    <div class="card">
      <h3 id="setup-title">挂件设置</h3>
      <p class="hint" id="setup-hint"></p>
      <div class="ckrow">
        <input type="checkbox" id="ck-bg" onchange="previewGlass()">
        <span>毛玻璃背景（模糊看穿到桌面，文字清晰）</span>
      </div>
      <label class="fld">毛玻璃透明度（越左越透，实时生效）</label>
      <div class="oprow">
        <input type="range" id="op" min="40" max="95" step="5" oninput="previewGlass()">
        <span class="opv" id="opv"></span>
      </div>
      <label class="fld">服务器地址</label>
      <input type="text" id="su" placeholder="例如 192.168.1.10:8300"
        onkeydown="if(event.key==='Enter')saveSetup()">
      <div class="err" id="serr"></div>
      <div class="btns">
        <button class="cancel" id="btn-close" onclick="closeSetup()">跳 过</button>
        <button class="ok" onclick="saveSetup()">保 存</button>
      </div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
