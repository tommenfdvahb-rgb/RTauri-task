name: 构建桌面挂件

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 编译
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: 重命名为中文名
        shell: pwsh
        run: Copy-Item src-tauri/target/release/project-widget.exe src-tauri/target/release/项目进度挂件.exe

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 项目进度挂件
          path: src-tauri/target/release/项目进度挂件.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 编译
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: 重命名为中文名
        shell: pwsh
        run: Copy-Item src-tauri/target/release/project-widget.exe 项目进度挂件.exe

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: 项目进度挂件.exe
